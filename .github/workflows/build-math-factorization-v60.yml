name: Build Math Tactical Factorization V60 Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/math-tactical-v60-factorization
    paths:
      - "scripts/prepare-classroom-v60.js"
      - "scripts/v60-source/**"
      - "scripts/patch-v60-factorization-workshop.js"
      - "scripts/v60-factorization-question-block.txt"
      - "scripts/math-factorization-v60-static-test.js"
      - "scripts/validate-math-factorization-v60-windows.ps1"
      - "school-game/MATH_FACTORING_V60_RELEASE.md"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-math-factorization-v60.yml"

permissions:
  contents: read

concurrency:
  group: math-factorization-v60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath math-v60-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Math Tactical source and contracts
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath math-v60-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build full local Windows installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath math-v60-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install launch and validate factorization runtime and final boss
        shell: pwsh
        run: ./scripts/validate-math-factorization-v60-windows.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-tactical-v60-factorization-diagnostics
          path: |
            math-v60-install.log
            math-v60-validation.log
            math-v60-build.log
            math-v60-startup.log
            math-v60-installer.log
            math-v60-ready-last.json
            math-v60-boss-last.json
            math-v60-question-last.json
            math-v60-vault-last.json
            math-v60-stdout.log
            math-v60-stderr.log
            math-v60-validation-error.log
            school-game/v60/game.js
            school-game/v60/styles.css
            school-game/v60/index.html
            school-game/v60/main.js
            school-game/v60/preload.js
          if-no-files-found: warn
          retention-days: 14

      - name: Upload downloadable full installer package
        uses: actions/upload-artifact@v4
        with:
          name: math-tactical-v60-factorization-full-installer
          path: dist/math-factorization-v60-windows/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
