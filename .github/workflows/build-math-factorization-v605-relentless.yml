name: Build Math Tactical V60.5 Relentless Boss Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/math-tactical-v60-5-relentless-boss
    paths:
      - "scripts/prepare-classroom-v60.js"
      - "scripts/v60-source/**"
      - "scripts/patch-v60-factorization-workshop.js"
      - "scripts/v60-factorization-question-block.txt"
      - "scripts/unpack-v61-boss-patch.js"
      - "scripts/v61-boss-patch.js.gz"
      - "scripts/patch-v60-teacher-mode-v604.js"
      - "scripts/patch-v60-teacher-mode-v604-runner.js"
      - "scripts/patch-v60-relentless-boss-v605.js"
      - "scripts/math-factorization-v605-relentless-static-test.js"
      - "scripts/validate-math-factorization-v605-windows.ps1"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-math-factorization-v605-relentless.yml"

permissions:
  contents: read

concurrency:
  group: math-factorization-v605-relentless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath math-v605-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate relentless boss teacher mode timers and factorization
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath math-v605-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build full local Windows installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath math-v605-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install launch and validate V60.5 relentless runtime
        shell: pwsh
        run: ./scripts/validate-math-factorization-v605-windows.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-tactical-v60.5-relentless-diagnostics
          path: |
            math-v605-install.log
            math-v605-validation.log
            math-v605-build.log
            math-v605-startup.log
            math-v605-installer.log
            math-v605-ready-last.json
            math-v605-boss-last.json
            math-v605-teacher-last.json
            math-v605-question-last.json
            math-v605-vault-last.json
            math-v605-stdout.log
            math-v605-stderr.log
            math-v605-validation-error.log
            school-game/v60/game.js
            school-game/v60/styles.css
            school-game/v60/index.html
            school-game/v60/main.js
            school-game/v60/preload.js
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final playable V60.5 package
        uses: actions/upload-artifact@v4
        with:
          name: math-tactical-v60.5-relentless-final-playable
          path: dist/math-factorization-v60-relentless-windows/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
