name: Build Final School USB V55 Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/final-school-usb-v55-static-test.js"
      - "scripts/prepare-final-school-usb-v55.js"
      - "scripts/v55-delta/**"
      - "scripts/prepare-professional-v50.js"
      - "scripts/v50-payload/**"
      - "scripts/prepare-advanced-v51.js"
      - "scripts/patch-advanced-v51-readiness.js"
      - "scripts/v51-payload/**"
      - "scripts/prepare-ratio-thales-v52.js"
      - "scripts/v52-payload/**"
      - "scripts/prepare-right-thales-vision-hounds-v53.js"
      - "scripts/v53-payload/**"
      - "scripts/prepare-clean-cones-squad-secure-results-v54.js"
      - "scripts/v54-payload/**"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/final-school-usb-v55-static-test.js"
      - "scripts/prepare-final-school-usb-v55.js"
      - "scripts/v55-delta/**"
      - "scripts/prepare-professional-v50.js"
      - "scripts/v50-payload/**"
      - "scripts/prepare-advanced-v51.js"
      - "scripts/patch-advanced-v51-readiness.js"
      - "scripts/v51-payload/**"
      - "scripts/prepare-ratio-thales-v52.js"
      - "scripts/v52-payload/**"
      - "scripts/prepare-right-thales-vision-hounds-v53.js"
      - "scripts/v53-payload/**"
      - "scripts/prepare-clean-cones-squad-secure-results-v54.js"
      - "scripts/v54-payload/**"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate Final School USB V55 source
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath final-school-v55-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer and portable EXE
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath final-school-v55-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install silently and validate packaged question layout and encrypted vault
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Resolve-Path "dist/final-school-usb-v55-windows"
          $setup = Get-ChildItem $dist -Filter "Geometry-Tactical-Final-School-Setup-55.0.0-x64.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "V55 NSIS installer was not found." }

          $installDir = Join-Path $env:RUNNER_TEMP "V55SchoolInstall"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Silent installer exited with code $($installer.ExitCode)." }

          $exe = Get-ChildItem $installDir -Filter "Geometry Tactical Final School Local.exe" -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed V55 application was not found." }

          $ready = Join-Path $env:RUNNER_TEMP "final-school-v55-ready.json"
          $runtimeLog = Join-Path $env:RUNNER_TEMP "final-school-v55-runtime.log"
          $vaultTest = Join-Path $env:RUNNER_TEMP "final-school-v55-vault-self-test.json"
          Remove-Item $ready,$runtimeLog,$vaultTest -Force -ErrorAction SilentlyContinue
          $env:V55_READY_FILE = $ready
          $env:V55_STARTUP_LOG = $runtimeLog
          $env:V55_SELF_TEST_FILE = $vaultTest
          $env:V55_TEST_PIN = "9109"
          $env:V55_QUESTION_PREVIEW = "thales"

          $process = Start-Process -FilePath $exe.FullName -PassThru
          "Installed EXE PID=$($process.Id) PATH=$($exe.FullName)" | Tee-Object -FilePath final-school-v55-startup.log

          $readyJson = $null
          for ($attempt = 0; $attempt -lt 75; $attempt++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) {
              if (Test-Path $runtimeLog) { Get-Content $runtimeLog | Tee-Object -FilePath final-school-v55-startup.log -Append }
              throw "Installed application exited with code $($process.ExitCode)."
            }
            if (Test-Path $ready) {
              try {
                $candidate = Get-Content $ready -Raw | ConvertFrom-Json
                if ($candidate.renderer.phase -eq "question-layout-preview") { $readyJson = $candidate; break }
              } catch {}
            }
          }
          if (-not $readyJson) {
            if (Test-Path $runtimeLog) { Get-Content $runtimeLog | Tee-Object -FilePath final-school-v55-startup.log -Append }
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "Installed V55 did not reach the deterministic question-layout preview."
          }

          if ($readyJson.version -ne "55.0.0") { throw "Unexpected version: $($readyJson.version)" }
          if ($readyJson.edition -ne "final-school-four-rooms-v55") { throw "Unexpected edition: $($readyJson.edition)" }
          if ($readyJson.renderer.fixedSimulationHz -ne 120) { throw "120 Hz simulation not reported." }
          if ($readyJson.renderer.levels -ne 4) { throw "Four levels were not reported." }
          if ($readyJson.renderer.newDifficultRooms -ne 2) { throw "Two new difficult rooms were not reported." }
          if ($readyJson.renderer.professionalV2LevelImages -lt 4) { throw "Four room images were not loaded." }
          if ($readyJson.renderer.questionSeconds -ne 60) { throw "Questions are not 60 seconds." }
          if ($readyJson.renderer.questionCanvasWidth -ne 1200 -or $readyJson.renderer.questionCanvasHeight -ne 620) { throw "Question canvas dimensions are incorrect." }
          if ($readyJson.renderer.questionLayoutFitsViewport -ne $true) { throw "Question layout does not fit the packaged viewport." }
          if ($readyJson.renderer.responsiveQuestionLayout -ne $true) { throw "Responsive question layout was not reported." }
          if ($readyJson.renderer.questionCanvasSafeMargins -ne $true) { throw "Question safe margins were not reported." }
          if ($readyJson.renderer.offlineOnly -ne $true) { throw "Offline-only mode was not reported." }
          if ($readyJson.renderer.schoolPcHardening -ne $true) { throw "School-PC hardening was not reported." }
          if ($readyJson.renderer.protectedResultsVault -ne $true) { throw "Protected results vault was not reported." }
          if ($readyJson.renderer.passwordGate -ne $true) { throw "PIN gate was not reported." }

          for ($attempt = 0; $attempt -lt 30 -and -not (Test-Path $vaultTest); $attempt++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $vaultTest)) { throw "Encrypted vault self-test file was not created." }
          $vault = Get-Content $vaultTest -Raw | ConvertFrom-Json
          if ($vault.ok -ne $true) { throw "Encrypted vault self-test failed: $(Get-Content $vaultTest -Raw)" }
          if ($vault.encryptedSave -ne $true -or $vault.wrongPinRejected -ne $true -or $vault.correctPinUnlocked -ne $true) { throw "Vault security checks failed." }
          if ($vault.questionRecorded -ne $true -or $vault.scoreRecorded -ne $true -or $vault.consolidatedStudentRows -lt 3) { throw "Student result consolidation checks failed." }

          Get-Content $ready | Tee-Object -FilePath final-school-v55-startup.log -Append
          Get-Content $vaultTest | Tee-Object -FilePath final-school-v55-startup.log -Append
          if (Test-Path $runtimeLog) { Get-Content $runtimeLog | Tee-Object -FilePath final-school-v55-startup.log -Append }
          & taskkill.exe /PID $process.Id /T /F | Out-Null

      - name: Validate portable executable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = Get-ChildItem "dist/final-school-usb-v55-windows" -Filter "Geometry-Tactical-Final-School-55.0.0-Portable-x64.exe" -File | Select-Object -First 1
          if (-not $portable) { throw "Portable V55 executable was not found." }
          $ready = Join-Path $env:RUNNER_TEMP "final-school-v55-portable-ready.json"
          $runtimeLog = Join-Path $env:RUNNER_TEMP "final-school-v55-portable-runtime.log"
          Remove-Item $ready,$runtimeLog -Force -ErrorAction SilentlyContinue
          $env:V55_READY_FILE = $ready
          $env:V55_STARTUP_LOG = $runtimeLog
          Remove-Item Env:V55_SELF_TEST_FILE -ErrorAction SilentlyContinue
          Remove-Item Env:V55_QUESTION_PREVIEW -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $portable.FullName -PassThru
          $readyJson = $null
          for ($attempt = 0; $attempt -lt 70; $attempt++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Portable application exited with code $($process.ExitCode)." }
            if (Test-Path $ready) {
              try {
                $candidate = Get-Content $ready -Raw | ConvertFrom-Json
                if ($candidate.renderer.phase -eq "renderer-bootstrap") { $readyJson = $candidate; break }
              } catch {}
            }
          }
          if (-not $readyJson) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "Portable V55 did not reach registration readiness."
          }
          if ($readyJson.renderer.levels -ne 4 -or $readyJson.renderer.questionSeconds -ne 60) { throw "Portable readiness contract is incomplete." }
          & taskkill.exe /PID $process.Id /T /F | Out-Null
          "Portable executable reached registration successfully." | Tee-Object -FilePath final-school-v55-portable.log

      - name: Create SHA-256 checksums and school USB kit
        shell: pwsh
        run: |
          $dist = Resolve-Path "dist/final-school-usb-v55-windows"
          Remove-Item "$dist/SHA256SUMS.txt" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$dist/SHA256SUMS.txt" -Append -Encoding ascii
          }

          @'
          param(
            [string]$FileName = "Geometry-Tactical-Final-School-Setup-55.0.0-x64.exe",
            [switch]$Run
          )
          $ErrorActionPreference = "Stop"
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $target = Join-Path $root $FileName
          $sumFile = Join-Path $root "SHA256SUMS.txt"
          if (-not (Test-Path $target)) { throw "File not found: $FileName" }
          $line = Get-Content $sumFile | Where-Object { $_ -match [regex]::Escape($FileName) } | Select-Object -First 1
          if (-not $line) { throw "Expected checksum not found for $FileName" }
          $expected = ($line -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Host "CHECKSUM FAILED. Do not install or run this file." -ForegroundColor Red
            Write-Host "Expected: $expected"
            Write-Host "Actual:   $actual"
            exit 2
          }
          Write-Host "SHA-256 verified: $FileName" -ForegroundColor Green
          if ($Run) { Start-Process -FilePath $target }
          '@ | Set-Content "$dist/VERIFY_FILE.ps1" -Encoding UTF8

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0VERIFY_FILE.ps1" -FileName "Geometry-Tactical-Final-School-Setup-55.0.0-x64.exe" -Run
          if errorlevel 1 (
            echo.
            echo Verification failed. The installer was not started.
            pause
            exit /b 1
          )
          echo.
          echo Installer verified and started.
          endlocal
          '@ | Set-Content "$dist/INSTALL_VERIFIED_FROM_USB.cmd" -Encoding ASCII

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0VERIFY_FILE.ps1" -FileName "Geometry-Tactical-Final-School-55.0.0-Portable-x64.exe" -Run
          if errorlevel 1 (
            echo.
            echo Verification failed. The portable game was not started.
            pause
            exit /b 1
          )
          echo.
          echo Portable game verified and started.
          endlocal
          '@ | Set-Content "$dist/RUN_PORTABLE_VERIFIED.cmd" -Encoding ASCII

          @'
          GEOMETRY TACTICAL FINAL SCHOOL V55 · OFFLINE USB KIT
          ====================================================

          RECOMMENDED INSTALLATION
          1. Copy this entire folder from the USB drive to the school PC.
          2. Double-click INSTALL_VERIFIED_FROM_USB.cmd.
          3. The script verifies the installer SHA-256 before opening it.
          4. Install for the current Windows user. Administrator rights are not required.

          PORTABLE USE
          Double-click RUN_PORTABLE_VERIFIED.cmd to verify and run without installation.

          CLASSROOM SETTINGS
          - Exactly three registered students.
          - Student 1: WASD movement.
          - Student 2: mouse aim.
          - Student 3: Space/F fire, R reload, E pickup/throw, Shift dash.
          - Four complete room levels.
          - Fixed 20-minute mission; pause disabled.
          - Every geometry problem allows 60 seconds.
          - Teacher results PIN: 9109.

          LOCAL RESULTS
          Student names, answers and scores are encrypted locally using AES-256-GCM.
          Open TEACHER RESULTS inside the game and enter PIN 9109.
          The encryption key is protected by the signed-in Windows account.

          OFFLINE AND SCHOOL-PC SAFETY
          - No analytics, telemetry, cloud upload or external web connection.
          - External navigation, popups, browser permissions and developer tools are disabled.
          - Per-user installation; no machine-wide service or background updater.
          - The game does not require internet access.

          WINDOWS SMARTSCREEN
          This build is not signed with a commercial code-signing certificate. Windows may show
          "Unknown publisher." School IT should verify SHA256SUMS.txt before approving it.
          The verification scripts in this folder prevent launch if the file hash is altered.

          DO NOT rename the EXE files unless the verification scripts are also updated.
          '@ | Set-Content "$dist/README_SCHOOL_USB.txt" -Encoding UTF8

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-school-v55-diagnostics
          path: |
            final-school-v55-validation.log
            final-school-v55-build.log
            final-school-v55-startup.log
            final-school-v55-portable.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final school USB package
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-final-school-v55-usb-kit
          path: |
            dist/final-school-usb-v55-windows/*.exe
            dist/final-school-usb-v55-windows/SHA256SUMS.txt
            dist/final-school-usb-v55-windows/VERIFY_FILE.ps1
            dist/final-school-usb-v55-windows/INSTALL_VERIFIED_FROM_USB.cmd
            dist/final-school-usb-v55-windows/RUN_PORTABLE_VERIFIED.cmd
            dist/final-school-usb-v55-windows/README_SCHOOL_USB.txt
          if-no-files-found: error
          retention-days: 30
