name: Build Pixel Tactical Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/prepare-school-game-assets.js"
      - "scripts/school-game-static-test.js"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/prepare-school-game-assets.js"
      - "scripts/school-game-static-test.js"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate pixel-art school game
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath pixel-game-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable EXE
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath pixel-game-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch packaged pixel application smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path "dist/school-windows/win-unpacked" -Filter "Neon Geometry Tactical Pixel Local.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Packaged pixel application executable was not found." }

          $ready = Join-Path $env:APPDATA "Neon Geometry Tactical Pixel Local\ready.json"
          Remove-Item $ready -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -PassThru
          "Started PID=$($process.Id)" | Tee-Object -FilePath pixel-game-startup.log

          for ($attempt = 0; $attempt -lt 45; $attempt++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Application exited with code $($process.ExitCode)." }
            if (Test-Path $ready) { break }
          }

          if (-not (Test-Path $ready)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "The pixel game did not report renderer and asset readiness within 45 seconds."
          }

          Get-Content $ready | Tee-Object -FilePath pixel-game-startup.log -Append
          "Packaged pixel game reached the armor catalog registration screen with all PNG sheets loaded." | Tee-Object -FilePath pixel-game-startup.log -Append
          & taskkill.exe /PID $process.Id /T /F | Out-Null

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/school-windows -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/school-windows/SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-game-diagnostics
          path: |
            pixel-game-validation.log
            pixel-game-build.log
            pixel-game-startup.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: neon-geometry-tactical-pixel-local-windows
          path: |
            dist/school-windows/*.exe
            dist/school-windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
