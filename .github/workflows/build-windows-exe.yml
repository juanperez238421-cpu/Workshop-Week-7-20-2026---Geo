name: Build Advanced Coop V51 Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/advanced-coop-v51-static-test.js"
      - "scripts/prepare-professional-v50.js"
      - "scripts/v50-payload/**"
      - "scripts/prepare-advanced-v51.js"
      - "scripts/v51-payload/**"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/advanced-coop-v51-static-test.js"
      - "scripts/prepare-professional-v50.js"
      - "scripts/v50-payload/**"
      - "scripts/prepare-advanced-v51.js"
      - "scripts/v51-payload/**"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 38
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate Advanced Coop V51 game
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath advanced-coop-v51-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable EXE
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath advanced-coop-v51-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch packaged Advanced Coop V51 application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path "dist/advanced-coop-v51-windows/win-unpacked" -Filter "Geometry Tactical Advanced Coop Local.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Packaged Advanced Coop V51 executable was not found." }

          $ready = Join-Path $env:APPDATA "Geometry Tactical Advanced Coop Local\ready.json"
          Remove-Item $ready -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -PassThru
          "Started PID=$($process.Id)" | Tee-Object -FilePath advanced-coop-v51-startup.log

          for ($attempt = 0; $attempt -lt 50; $attempt++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Application exited with code $($process.ExitCode)." }
            if (Test-Path $ready) { break }
          }

          if (-not (Test-Path $ready)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "Advanced Coop V51 did not report renderer readiness within 50 seconds."
          }

          $readyJson = Get-Content $ready -Raw | ConvertFrom-Json
          if ($readyJson.version -ne "51.0.0") { throw "Unexpected readiness version: $($readyJson.version)" }
          if ($readyJson.edition -ne "advanced-coop-weapons-v51") { throw "Unexpected readiness edition: $($readyJson.edition)" }
          if ($readyJson.renderer.fixedSimulationHz -ne 120) { throw "The renderer did not report the 120 Hz simulation." }
          if ($readyJson.renderer.levels -ne 2) { throw "The renderer did not report both levels." }
          if ($readyJson.renderer.weapons -lt 6) { throw "The renderer did not report the complete weapon catalog." }
          if ($readyJson.renderer.controlRoles -ne 3) { throw "The renderer did not report three control roles." }
          Get-Content $ready | Tee-Object -FilePath advanced-coop-v51-startup.log -Append
          "Packaged Advanced Coop V51 reached registration with Professional V2 assets, two levels, six weapons and three cooperative roles." | Tee-Object -FilePath advanced-coop-v51-startup.log -Append
          & taskkill.exe /PID $process.Id /T /F | Out-Null

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/advanced-coop-v51-windows -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/advanced-coop-v51-windows/SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-coop-v51-diagnostics
          path: |
            advanced-coop-v51-validation.log
            advanced-coop-v51-build.log
            advanced-coop-v51-startup.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-advanced-coop-v51-windows
          path: |
            dist/advanced-coop-v51-windows/*.exe
            dist/advanced-coop-v51-windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
