name: Build Final Boss Clean HUD V58 Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/prepare-final-boss-v58.js"
      - "scripts/v58-source/**"
      - "scripts/final-boss-clean-hud-v58-static-test.js"
      - "scripts/validate-final-boss-v58-windows.ps1"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches:
      - main
      - feature/final-boss-clean-hud-v58
    paths:
      - "scripts/prepare-final-boss-v58.js"
      - "scripts/v58-source/**"
      - "scripts/final-boss-clean-hud-v58-static-test.js"
      - "scripts/validate-final-boss-v58-windows.ps1"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: v58-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report validation start
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh pr comment 45 --body "V58 Windows validation started in Actions run **${{ github.run_id }}**."

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate V58 source and assessment contracts
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath final-boss-clean-hud-v58-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer and portable EXE
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath final-boss-clean-hud-v58-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installed package and create USB kit
        shell: pwsh
        run: ./scripts/validate-final-boss-v58-windows.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-boss-clean-hud-v58-diagnostics
          path: |
            final-boss-clean-hud-v58-validation.log
            final-boss-clean-hud-v58-build.log
            final-boss-clean-hud-v58-startup.log
            final-boss-clean-hud-v58-portable.log
            final-boss-clean-hud-v58-runtime.log
            final-boss-clean-hud-v58-ready-last.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final school USB package
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-final-boss-clean-hud-v58-usb-kit
          path: dist/final-boss-clean-hud-v58-windows/**
          if-no-files-found: error
          retention-days: 30

      - name: Report successful package
        if: success() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh pr comment 45 --body "V58 Windows package validated in Actions run **${{ github.run_id }}**. Artifact: geometry-tactical-final-boss-clean-hud-v58-usb-kit."
