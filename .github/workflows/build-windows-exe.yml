name: Build Geometry Tactical Classroom V59

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/prepare-classroom-v59.js"
      - "scripts/v59-source/**"
      - "scripts/classroom-v59-static-test.js"
      - "scripts/validate-classroom-v59-windows.ps1"
      - "school-game/V59_RELEASE.md"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches:
      - main
      - feature/classroom-v59-login-melee-questions
    paths:
      - "scripts/prepare-classroom-v59.js"
      - "scripts/v59-source/**"
      - "scripts/classroom-v59-static-test.js"
      - "scripts/validate-classroom-v59-windows.ps1"
      - "school-game/V59_RELEASE.md"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

concurrency:
  group: classroom-v59-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath classroom-v59-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate classroom V59 source and contracts
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath classroom-v59-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable Windows application
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath classroom-v59-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate portable runtime and encrypted vault
        shell: pwsh
        run: ./scripts/validate-classroom-v59-windows.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-v59-diagnostics
          path: |
            classroom-v59-install.log
            classroom-v59-validation.log
            classroom-v59-build.log
            classroom-v59-startup.log
            classroom-v59-portable.log
            classroom-v59-ready-last.json
            classroom-v59-vault-last.json
            classroom-v59-stdout.log
            classroom-v59-stderr.log
            classroom-v59-validation-error.log
            school-game/v59/game.js
            school-game/v59/styles.css
            school-game/v59/index.html
            school-game/v59/main.js
            school-game/v59/preload.js
          if-no-files-found: warn
          retention-days: 14

      - name: Upload downloadable classroom package
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-v59-classroom-portable
          path: dist/classroom-v59-windows/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
