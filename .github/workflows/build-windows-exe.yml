name: Build Professional V2 Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/school-game-static-test.js"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/school-game-static-test.js"
      - "scripts/prepare-desktop-assets.js"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate professional V2 game and atlases
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath professional-v2-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and portable EXE
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath professional-v2-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch packaged professional V2 application smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path "dist/professional-v2-windows/win-unpacked" -Filter "Geometry Tactical Professional V2 Local.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Packaged Professional V2 executable was not found." }

          $ready = Join-Path $env:APPDATA "Geometry Tactical Professional V2 Local\ready.json"
          Remove-Item $ready -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -PassThru
          "Started PID=$($process.Id)" | Tee-Object -FilePath professional-v2-startup.log

          for ($attempt = 0; $attempt -lt 45; $attempt++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Application exited with code $($process.ExitCode)." }
            if (Test-Path $ready) { break }
          }

          if (-not (Test-Path $ready)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "The Professional V2 game did not report atlas and renderer readiness within 45 seconds."
          }

          $readyJson = Get-Content $ready -Raw | ConvertFrom-Json
          if ($readyJson.version -ne "50.0.0") { throw "Unexpected readiness version: $($readyJson.version)" }
          if ($readyJson.edition -ne "professional-v2-assets-v50") { throw "Unexpected readiness edition: $($readyJson.edition)" }
          Get-Content $ready | Tee-Object -FilePath professional-v2-startup.log -Append
          "Packaged Professional V2 game reached the registration screen with all dedicated atlases and both level images loaded." | Tee-Object -FilePath professional-v2-startup.log -Append
          & taskkill.exe /PID $process.Id /T /F | Out-Null

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/professional-v2-windows -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/professional-v2-windows/SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-v2-diagnostics
          path: |
            professional-v2-validation.log
            professional-v2-build.log
            professional-v2-startup.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-professional-v2-windows
          path: |
            dist/professional-v2-windows/*.exe
            dist/professional-v2-windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
