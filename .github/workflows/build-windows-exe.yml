name: Build Geometry Tactical Classroom V60 Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/prepare-classroom-v60.js"
      - "scripts/v60-source/**"
      - "scripts/classroom-v60-static-test.js"
      - "scripts/validate-classroom-v60-windows.ps1"
      - "school-game/V60_RELEASE.md"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches:
      - main
      - feature/classroom-v60-thales-labels-pause
    paths:
      - "scripts/prepare-classroom-v60.js"
      - "scripts/v60-source/**"
      - "scripts/classroom-v60-static-test.js"
      - "scripts/validate-classroom-v60-windows.ps1"
      - "school-game/V60_RELEASE.md"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

concurrency:
  group: classroom-v60-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath classroom-v60-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate classroom V60 source and contracts
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath classroom-v60-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build full local Windows installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath classroom-v60-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, launch and validate encrypted runtime
        shell: pwsh
        run: ./scripts/validate-classroom-v60-windows.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-v60-installer-diagnostics
          path: |
            classroom-v60-install.log
            classroom-v60-validation.log
            classroom-v60-build.log
            classroom-v60-startup.log
            classroom-v60-installer.log
            classroom-v60-ready-last.json
            classroom-v60-vault-last.json
            classroom-v60-stdout.log
            classroom-v60-stderr.log
            classroom-v60-validation-error.log
            school-game/v60/game.js
            school-game/v60/styles.css
            school-game/v60/index.html
            school-game/v60/main.js
            school-game/v60/preload.js
          if-no-files-found: warn
          retention-days: 14

      - name: Upload downloadable full installer package
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-v60-full-local-installer
          path: dist/classroom-v60-windows/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
