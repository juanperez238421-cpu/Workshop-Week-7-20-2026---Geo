name: Build Windows Local EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "server/**"
      - "index.html"
      - "config.js"
      - "package.json"
      - "master.html"
      - "master-local-results.*"
      - "teacher-auth.js"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "server/**"
      - "index.html"
      - "config.js"
      - "package.json"
      - "master.html"
      - "master-local-results.*"
      - "teacher-auth.js"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Install embedded server dependencies
        shell: pwsh
        run: npm install --prefix server --omit=dev --no-audit --no-fund

      - name: Validate game and desktop runtime
        shell: pwsh
        run: npm test

      - name: Build Windows installer and portable EXE
        shell: pwsh
        run: npm run desktop:dist:win

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/windows -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/windows/SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: triad-territory-rush-local-windows
          path: |
            dist/windows/*.exe
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
