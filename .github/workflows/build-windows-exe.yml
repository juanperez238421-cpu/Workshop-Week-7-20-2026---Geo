name: Build Final School USB V55 Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/**"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "school-game/**"
      - "scripts/**"
      - "desktop/assets/**"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate Final School USB V55 source
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath final-school-v55-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer and portable EXE
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath final-school-v55-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and validate question layout and encrypted vault
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Resolve-Path "dist/final-school-usb-v55-windows"
          $setup = Get-ChildItem $dist -Filter "Geometry-Tactical-Final-School-Setup-55.0.0-x64.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "V55 installer was not found." }

          $installDir = Join-Path $env:RUNNER_TEMP "V55SchoolInstall"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $installer = Start-Process $setup.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Silent installation failed with code $($installer.ExitCode)." }

          $exe = Get-ChildItem $installDir -Filter "Geometry Tactical Final School Local.exe" -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed V55 executable was not found." }

          $ready = Join-Path $env:RUNNER_TEMP "v55-installed-ready.json"
          $runtime = Join-Path $env:RUNNER_TEMP "v55-installed-runtime.log"
          $vaultFile = Join-Path $env:RUNNER_TEMP "v55-installed-vault.json"
          Remove-Item $ready,$runtime,$vaultFile -Force -ErrorAction SilentlyContinue
          $env:V55_READY_FILE = $ready
          $env:V55_STARTUP_LOG = $runtime
          $env:V55_SELF_TEST_FILE = $vaultFile
          $env:V55_TEST_PIN = "9109"
          $env:V55_QUESTION_PREVIEW = "thales"

          $process = Start-Process $exe.FullName -PassThru
          "Installed PID=$($process.Id) PATH=$($exe.FullName)" | Tee-Object final-school-v55-startup.log
          $report = $null
          for ($i = 0; $i -lt 75; $i++) {
            Start-Sleep 1
            $process.Refresh()
            if ($process.HasExited) {
              if (Test-Path $runtime) { Get-Content $runtime | Tee-Object final-school-v55-startup.log -Append }
              throw "Installed application exited with code $($process.ExitCode)."
            }
            if (Test-Path $ready) {
              try {
                $candidate = Get-Content $ready -Raw | ConvertFrom-Json
                if ($candidate.renderer.phase -eq "question-layout-preview") { $report = $candidate; break }
              } catch {}
            }
          }
          if (-not $report) { throw "Installed V55 did not reach the question-layout preview." }
          if ($report.version -ne "55.0.0" -or $report.edition -ne "final-school-four-rooms-v55") { throw "Installed identity is incorrect." }
          if ($report.renderer.fixedSimulationHz -ne 120 -or $report.renderer.levels -ne 4 -or $report.renderer.newDifficultRooms -ne 2) { throw "Installed four-room engine contract failed." }
          if ($report.renderer.professionalV2LevelImages -lt 4) { throw "Four room images did not load." }
          if ($report.renderer.questionSeconds -ne 60 -or $report.renderer.questionCanvasWidth -ne 1200 -or $report.renderer.questionCanvasHeight -ne 620) { throw "Question timing or canvas contract failed." }
          if ($report.renderer.questionLayoutFitsViewport -ne $true -or $report.renderer.responsiveQuestionLayout -ne $true -or $report.renderer.questionCanvasSafeMargins -ne $true) { throw "Question layout exceeds the packaged viewport." }
          if ($report.renderer.offlineOnly -ne $true -or $report.renderer.schoolPcHardening -ne $true) { throw "Offline school-PC hardening was not reported." }
          if ($report.renderer.protectedResultsVault -ne $true -or $report.renderer.passwordGate -ne $true) { throw "Protected results controls were not reported." }

          for ($i = 0; $i -lt 30 -and -not (Test-Path $vaultFile); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $vaultFile)) { throw "Encrypted vault self-test was not created." }
          $vault = Get-Content $vaultFile -Raw | ConvertFrom-Json
          if ($vault.ok -ne $true -or $vault.encryptedSave -ne $true -or $vault.wrongPinRejected -ne $true -or $vault.correctPinUnlocked -ne $true) { throw "Encrypted vault security checks failed." }
          if ($vault.questionRecorded -ne $true -or $vault.scoreRecorded -ne $true -or $vault.consolidatedStudentRows -lt 3) { throw "Student data consolidation checks failed." }

          Get-Content $ready | Tee-Object final-school-v55-startup.log -Append
          Get-Content $vaultFile | Tee-Object final-school-v55-startup.log -Append
          if (Test-Path $runtime) { Get-Content $runtime | Tee-Object final-school-v55-startup.log -Append }
          & taskkill.exe /PID $process.Id /T /F | Out-Null

      - name: Validate portable package structure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = Get-ChildItem "dist/final-school-usb-v55-windows" -Filter "Geometry-Tactical-Final-School-55.0.0-Portable-x64.exe" -File | Select-Object -First 1
          if (-not $portable) { throw "Portable V55 executable was not found." }
          if ($portable.Length -lt 90000000) { throw "Portable package is unexpectedly small: $($portable.Length) bytes." }
          $stream = [System.IO.File]::OpenRead($portable.FullName)
          try {
            $first = $stream.ReadByte()
            $second = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($first -ne 0x4D -or $second -ne 0x5A) { throw "Portable package does not have a valid Windows PE header." }
          "Portable PE package validated: $($portable.Name), $($portable.Length) bytes. It contains the same packaged app validated through the installed NSIS build." | Tee-Object final-school-v55-portable.log

      - name: Create checksums and school USB verification kit
        shell: pwsh
        run: |
          $dist = Resolve-Path "dist/final-school-usb-v55-windows"
          Remove-Item "$dist/SHA256SUMS.txt" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File "$dist/SHA256SUMS.txt" -Append -Encoding ascii
          }

          @'
          param([string]$FileName,[switch]$Run)
          $ErrorActionPreference = "Stop"
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $target = Join-Path $root $FileName
          $line = Get-Content (Join-Path $root "SHA256SUMS.txt") | Where-Object { $_ -match [regex]::Escape($FileName) } | Select-Object -First 1
          if (-not (Test-Path $target) -or -not $line) { throw "Verification target or checksum is missing." }
          $expected = ($line -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { Write-Host "CHECKSUM FAILED. Do not run this file." -ForegroundColor Red; exit 2 }
          Write-Host "SHA-256 verified: $FileName" -ForegroundColor Green
          if ($Run) { Start-Process $target }
          '@ | Set-Content "$dist/VERIFY_FILE.ps1" -Encoding UTF8

          @'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0VERIFY_FILE.ps1" -FileName "Geometry-Tactical-Final-School-Setup-55.0.0-x64.exe" -Run
          if errorlevel 1 (pause & exit /b 1)
          '@ | Set-Content "$dist/INSTALL_VERIFIED_FROM_USB.cmd" -Encoding ASCII

          @'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0VERIFY_FILE.ps1" -FileName "Geometry-Tactical-Final-School-55.0.0-Portable-x64.exe" -Run
          if errorlevel 1 (pause & exit /b 1)
          '@ | Set-Content "$dist/RUN_PORTABLE_VERIFIED.cmd" -Encoding ASCII

          @'
          GEOMETRY TACTICAL FINAL SCHOOL V55 · OFFLINE USB KIT

          Copy this complete folder from the USB drive to each school PC.
          Run INSTALL_VERIFIED_FROM_USB.cmd for normal per-user installation.
          Run RUN_PORTABLE_VERIFIED.cmd to use the game without installation.
          Both scripts verify SHA-256 before launch.

          Controls: Student 1 WASD; Student 2 mouse aim; Student 3 Space/F, R, E and Shift.
          Four complete rooms; fixed 20-minute mission; pause disabled; 60 seconds per question.
          Teacher Results PIN: 9109.

          Student names, answers and scores are encrypted locally with AES-256-GCM and a Windows-protected key.
          The game is offline and contains no analytics, telemetry, cloud upload, updater or external navigation.
          This build is not commercially code-signed, so Windows may display Unknown publisher.
          School IT should verify SHA256SUMS.txt before approval.
          '@ | Set-Content "$dist/README_SCHOOL_USB.txt" -Encoding UTF8

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-school-v55-diagnostics
          path: |
            final-school-v55-validation.log
            final-school-v55-build.log
            final-school-v55-startup.log
            final-school-v55-portable.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final school USB package
        uses: actions/upload-artifact@v4
        with:
          name: geometry-tactical-final-school-v55-usb-kit
          path: |
            dist/final-school-usb-v55-windows/*.exe
            dist/final-school-usb-v55-windows/SHA256SUMS.txt
            dist/final-school-usb-v55-windows/VERIFY_FILE.ps1
            dist/final-school-usb-v55-windows/INSTALL_VERIFIED_FROM_USB.cmd
            dist/final-school-usb-v55-windows/RUN_PORTABLE_VERIFIED.cmd
            dist/final-school-usb-v55-windows/README_SCHOOL_USB.txt
          if-no-files-found: error
          retention-days: 30
