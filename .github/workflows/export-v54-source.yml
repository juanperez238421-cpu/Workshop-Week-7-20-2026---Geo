name: Export V54 Generated Source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-v54-source.yml"
      - "scripts/v54-payload/**"
      - "scripts/prepare-clean-cones-squad-secure-results-v54.js"
      - "package.json"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reconstruct generated source
        run: node scripts/prepare-clean-cones-squad-secure-results-v54.js
      - name: Package V54 source
        run: zip -r v54-generated-source.zip school-game/v54
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: v54-generated-source
          path: v54-generated-source.zip
          retention-days: 7
