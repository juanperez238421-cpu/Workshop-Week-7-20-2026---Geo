name: Export V55 Generated Source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-v55-source.yml"
      - "scripts/prepare-final-school-usb-v55.js"
      - "scripts/v55-delta/**"
      - "package.json"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reconstruct generated source
        run: npm run prepare
      - name: Package V55 source
        run: zip -r v55-generated-source.zip school-game/v55
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: v55-generated-source
          path: v55-generated-source.zip
          retention-days: 7
