name: Export V56 Source for V57

on:
  push:
    branches:
      - feature/room3-glass-ballistics-v57
    paths:
      - ".github/workflows/export-v56-source-for-v57.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reconstruct V56 generated source
        run: |
          node scripts/prepare-professional-v50.js
          node scripts/prepare-advanced-v51.js
          node scripts/patch-advanced-v51-readiness.js
          node scripts/prepare-ratio-thales-v52.js
          node scripts/prepare-right-thales-vision-hounds-v53.js
          node scripts/prepare-clean-cones-squad-secure-results-v54.js
          node scripts/prepare-final-school-usb-v55.js
          node scripts/prepare-persistent-timer-pythagoras-v56.js
      - name: Package generated source
        run: |
          mkdir -p export
          cp -R school-game/v56 export/
          tar -czf export/v56-generated-source.tar.gz school-game/v56
      - uses: actions/upload-artifact@v4
        with:
          name: v56-generated-source-for-v57
          path: export/
          retention-days: 7
