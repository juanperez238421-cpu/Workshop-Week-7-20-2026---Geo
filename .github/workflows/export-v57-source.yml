name: Export prepared V57 source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-v57-source.yml"
      - "scripts/**"
      - "school-game/**"
      - "package.json"
  push:
    branches:
      - feature/final-boss-clean-hud-v58
    paths:
      - ".github/workflows/export-v57-source.yml"
      - "scripts/**"
      - "school-game/**"
      - "package.json"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare current V57 source
        run: npm run prepare
      - name: Archive generated V57 source
        run: |
          test -d school-game/v57
          tar -czf prepared-v57-source.tar.gz school-game/v57
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-v57-source
          path: prepared-v57-source.tar.gz
          if-no-files-found: error
          retention-days: 2
